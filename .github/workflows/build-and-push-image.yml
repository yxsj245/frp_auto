name: Build and Push

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. latest, v0.62.0)'
        required: true
        default: 'latest'
      platforms:
        description: 'Build platforms'
        required: true
        type: choice
        options:
          - 'linux/amd64'
          - 'linux/amd64,linux/arm64'
          - 'linux/amd64,linux/arm/v7,linux/arm64'
          - 'linux/amd64,linux/arm/v7,linux/arm64,linux/ppc64le,linux/s390x'
        default: 'linux/amd64'

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build Docker Images and Binaries
    runs-on: ubuntu-latest
    steps:
      # environment
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # get image tag name
      - name: Get Image Tag Name
        run: |
          echo "TAG_NAME=${{ github.event.inputs.tag }}" >> $GITHUB_ENV

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v4
        with:
          registry: registry.cn-beijing.aliyuncs.com
          username: yxsj2459561
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      # build Docker images
      - name: Build and push frpc
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dockerfiles/Dockerfile-for-frpc
          platforms: ${{ inputs.platforms }}
          push: true
          tags: |
            registry.cn-beijing.aliyuncs.com/xiaozhu245/frp_auto:frpc-${{ env.TAG_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frps
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dockerfiles/Dockerfile-for-frps
          platforms: ${{ inputs.platforms }}
          push: true
          tags: |
            registry.cn-beijing.aliyuncs.com/xiaozhu245/frp_auto:frps-${{ env.TAG_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # build binaries
      - name: Build web assets
        run: |
          make -C web/frps build
          make -C web/frpc build

      - name: Cross-compile binaries for selected platforms
        run: |
          IFS=',' read -ra PLATFORMS <<< "${{ inputs.platforms }}"
          mkdir -p bin
          for platform in "${PLATFORMS[@]}"; do
            platform=$(echo "$platform" | xargs)
            os="${platform%%/*}"
            arch_variant="${platform#*/}"
            goarch="${arch_variant%%/*}"
            goarm=""
            if [[ "$arch_variant" == *"/"* ]]; then
              goarm="${arch_variant#*/}"
            fi

            export GOOS="$os"
            export GOARCH="$goarch"
            if [ -n "$goarm" ]; then
              export GOARM="$goarm"
            fi

            bin_suffix="${os}_${goarch}"
            [ -n "$goarm" ] && bin_suffix="${bin_suffix}_v${goarm}"

            echo "Building frpc for $os/$goarch${goarm:+ v$goarm}..."
            go build -trimpath -ldflags "-s -w" -tags "frpc" -o "bin/frpc_${bin_suffix}" ./cmd/frpc

            echo "Building frps for $os/$goarch${goarm:+ v$goarm}..."
            go build -trimpath -ldflags "-s -w" -tags "frps" -o "bin/frps_${bin_suffix}" ./cmd/frps
          done

      - name: Upload all binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/*
